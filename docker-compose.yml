version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: rentnest-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: rentnest
      MYSQL_USER: rentnest_user
      MYSQL_PASSWORD: rentnest_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./rentnest_schema.sql:/docker-entrypoint-initdb.d/1_schema.sql
      - ./rentnest_procedures.sql:/docker-entrypoint-initdb.d/2_procedures.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rentnest-redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rentnest-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: rentnest_user
      DB_PASSWORD: rentnest_password
      DB_NAME: rentnest
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: super_secret_production_jwt_key_rentnest_2026
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
