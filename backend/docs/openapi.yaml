openapi: 3.1.0
info:
  title: RentNest Enterprise SaaS Backend API
  description: |
    Comprehensive OpenAPI 3.1 specification for the RentNest Property Management and Rental SaaS Platform.
    Includes full authentication flows, RBAC authorization rules, property lifecycle management, tenant/owner workflows, financial invoices & payments, AI intelligence integration, and real-time Socket.IO communications.
  version: 1.0.0
  contact:
    name: RentNest Engineering Team
    email: api-support@rentnest.com
    url: https://rentnest.com/developer
  license:
    name: Proprietary Enterprise License
    url: https://rentnest.com/terms

servers:
  - url: http://localhost:5000/api/v1
    description: Local Development Server
  - url: https://staging-api.rentnest.com/api/v1
    description: Staging Environment
  - url: https://api.rentnest.com/api/v1
    description: Production Environment

tags:
  - name: Infrastructure & Health
    description: System liveness, readiness, and database diagnostic endpoints.
  - name: Authentication
    description: User registration, login, JWT token lifecycle, and session management.
  - name: Users & Profiles
    description: User account profiles, status management, and audit history.
  - name: RBAC Security
    description: Role definitions, granular permission assignments, and access control.
  - name: Properties & Units
    description: Property listing management, unit inventory, favorites, and reviews.
  - name: Discovery & Recommendations
    description: Faceted search engine, property comparison, and suggestion engine.
  - name: Leases & Bookings
    description: Rental applications, property viewing bookings, and digital lease signatures.
  - name: Financial Engine
    description: Rent invoicing, payment processing, revenue trends, and owner payout reporting.
  - name: Maintenance & Dispatch
    description: Ticket creation, status tracking, and vendor job assignment.
  - name: Communication & Messaging
    description: Real-time user conversations, messaging, and push notifications.
  - name: Analytics Engine
    description: Executive metrics, occupancy reports, revenue analytics, and data exports.
  - name: AI Intelligence Layer
    description: Semantic search, NLP sentiment analysis, ticket auto-categorization, and fraud risk scoring.
  - name: Administration Platform
    description: System impersonation, global audit logging, cross-entity search, and security metrics.

paths:
  /health:
    get:
      tags:
        - Infrastructure & Health
      summary: System Health Check
      description: Returns overall operational health status of the API service and MySQL database pool.
      responses:
        '200':
          description: System operational
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
              example:
                success: true
                message: System overall health status
                data:
                  status: UP
                  timestamp: "2026-07-24T15:50:00Z"
                  uptime: 142305.4
                  environment: production
                  services:
                    database: HEALTHY
                    application: HEALTHY
        '503':
          description: System degraded or database unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /health/liveness:
    get:
      tags:
        - Infrastructure & Health
      summary: Kubernetes Liveness Probe
      responses:
        '200':
          description: Container process is alive
          content:
            application/json:
              example:
                success: true
                message: Container runtime process is alive.
                data:
                  status: ALIVE

  /health/readiness:
    get:
      tags:
        - Infrastructure & Health
      summary: Kubernetes Readiness Probe
      responses:
        '200':
          description: Service ready to accept traffic
        '503':
          description: Service not ready

  /health/database:
    get:
      tags:
        - Infrastructure & Health
      summary: Database Connection Diagnostic
      responses:
        '200':
          description: Database pool connected successfully

  /health/application:
    get:
      tags:
        - Infrastructure & Health
      summary: Application Runtime Metrics
      responses:
        '200':
          description: Node.js runtime process statistics

  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register New User Account
      description: Rate-limited to 15 attempts per 15 minutes. Registers a new tenant, property owner, or vendor account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
              example:
                success: true
                message: Registration successful. Verification email dispatched.
                data:
                  user:
                    id: "usr_9b1deb4d"
                    email: "tenant@example.com"
                    firstName: "John"
                    lastName: "Doe"
                    roleName: "ROLE_TENANT"
                    status: "PENDING_VERIFICATION"
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/login:
    post:
      tags:
        - Authentication
      summary: User Login
      description: Authenticates user credentials, generates JWT access token and HTTP-Only refresh cookie. Rate-limited to 15 attempts per 15m.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              example:
                success: true
                message: User login successful.
                data:
                  accessToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  expiresIn: 900
                  user:
                    id: "usr_9b1deb4d"
                    email: "tenant@example.com"
                    firstName: "John"
                    lastName: "Doe"
                    roleName: "ROLE_TENANT"
                    permissions: ["property:read", "lease:read", "payment:write"]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout User Session
      description: Invalidates active session token and clears refresh cookie.
      responses:
        '200':
          description: Logout successful

  /auth/refresh-token:
    post:
      tags:
        - Authentication
      summary: Refresh JWT Access Token
      description: Issues a new 15-minute access token using the HTTP-Only refresh token.
      responses:
        '200':
          description: New access token issued successfully
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/verify-email:
    post:
      tags:
        - Authentication
      summary: Verify User Email Address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Email verified successfully

  /auth/resend-verification:
    post:
      tags:
        - Authentication
      summary: Resend Email Verification Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Verification email resent

  /auth/forgot-password:
    post:
      tags:
        - Authentication
      summary: Initiate Password Reset Flow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Password reset email dispatched if email exists

  /auth/reset-password:
    post:
      tags:
        - Authentication
      summary: Complete Password Reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token:
                  type: string
                newPassword:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: Password reset successful

  /auth/me:
    get:
      tags:
        - Authentication
      summary: Get Authenticated User Profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile details
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/change-password:
    post:
      tags:
        - Authentication
      summary: Change Authenticated User Password
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: Password updated successfully

  /auth/verify-password:
    post:
      tags:
        - Authentication
      summary: Re-verify Password for Sensitive Actions
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
      responses:
        '200':
          description: Password confirmed valid

  /auth/sessions:
    get:
      tags:
        - Authentication
      summary: List Active Sessions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active sessions for current user

  /auth/sessions/{sessionId}:
    delete:
      tags:
        - Authentication
      summary: Terminate Specific Active Session
      security:
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Session revoked

  /users:
    get:
      tags:
        - Users & Profiles
      summary: List Users (Paginated & Filtered)
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: role
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated list of users
        '403':
          $ref: '#/components/responses/Forbidden'

  /users/{id}:
    get:
      tags:
        - Users & Profiles
      summary: Get User by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User details

  /users/{id}/profile:
    put:
      tags:
        - Users & Profiles
      summary: Update User Profile
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profile updated successfully

  /users/{id}/status:
    patch:
      tags:
        - Users & Profiles
      summary: Update User Status (Admin Only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [ACTIVE, SUSPENDED, PENDING_VERIFICATION, DEACTIVATED]
                reason:
                  type: string
      responses:
        '200':
          description: User status updated successfully
        '403':
          $ref: '#/components/responses/Forbidden'

  /users/{id}/reset-password:
    post:
      tags:
        - Users & Profiles
      summary: Force Password Reset (Admin Only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Password reset link generated

  /users/{id}/force-logout:
    post:
      tags:
        - Users & Profiles
      summary: Force Terminate All User Sessions (Admin Only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User force logged out across all devices

  /users/{id}/audit-history:
    get:
      tags:
        - Users & Profiles
      summary: Get User Activity Audit Log (Admin Only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User audit log history

  /rbac/roles:
    get:
      tags:
        - RBAC Security
      summary: List System Roles
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of roles and permission counts

  /rbac/roles/{roleId}:
    get:
      tags:
        - RBAC Security
      summary: Get Role Details
      security:
        - bearerAuth: []
      parameters:
        - name: roleId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Role details with full permission list

  /rbac/permissions:
    get:
      tags:
        - RBAC Security
      summary: List System Permissions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All available permission string tokens

  /rbac/users/{userId}/roles:
    post:
      tags:
        - RBAC Security
      summary: Assign Role to User (Admin Only)
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roleId]
              properties:
                roleId:
                  type: string
      responses:
        '200':
          description: Role assigned to user

  /rbac/users/{userId}/roles/{roleId}:
    delete:
      tags:
        - RBAC Security
      summary: Revoke Role from User (Admin Only)
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: roleId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Role revoked from user

  /rbac/roles/{roleId}/permissions:
    post:
      tags:
        - RBAC Security
      summary: Assign Permissions to Role (Admin Only)
      security:
        - bearerAuth: []
      parameters:
        - name: roleId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissionIds]
              properties:
                permissionIds:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Permissions assigned to role

  /rbac/roles/{roleId}/permissions/{permissionId}:
    delete:
      tags:
        - RBAC Security
      summary: Revoke Permission from Role (Admin Only)
      security:
        - bearerAuth: []
      parameters:
        - name: roleId
          in: path
          required: true
          schema:
            type: string
        - name: permissionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Permission revoked from role

  /properties/search:
    get:
      tags:
        - Properties & Units
      summary: Search Property Listings
      description: Public endpoint to query, filter, and paginate property listings.
      parameters:
        - name: city
          in: query
          schema:
            type: string
        - name: minPrice
          in: query
          schema:
            type: number
        - name: maxPrice
          in: query
          schema:
            type: number
        - name: propertyType
          in: query
          schema:
            type: string
            enum: [APARTMENT, HOUSE, CONDO, COMMERCIAL]
        - name: bedrooms
          in: query
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 12
      responses:
        '200':
          description: Search results with pagination meta

  /properties/{id}:
    get:
      tags:
        - Properties & Units
      summary: Get Property Details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Property detail including units and owner info
    put:
      tags:
        - Properties & Units
      summary: Update Property Listing (Owner/Admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropertyRequest'
      responses:
        '200':
          description: Property updated
    delete:
      tags:
        - Properties & Units
      summary: Delete Property Listing (Owner/Admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Property deleted

  /properties:
    post:
      tags:
        - Properties & Units
      summary: Create Property Listing (Owner/Admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropertyRequest'
      responses:
        '201':
          description: Property created successfully

  /properties/{propertyId}/reviews:
    get:
      tags:
        - Properties & Units
      summary: Get Reviews for Property
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Property review ratings and comments

  /properties/reviews:
    post:
      tags:
        - Properties & Units
      summary: Submit Property Review
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [propertyId, rating, comment]
              properties:
                propertyId:
                  type: string
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                comment:
                  type: string
      responses:
        '201':
          description: Review submitted

  /properties/favorites/me:
    get:
      tags:
        - Properties & Units
      summary: Get User's Favorite Units
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User saved favorites list

  /properties/units/{unitId}/favorite:
    post:
      tags:
        - Properties & Units
      summary: Favorite a Unit
      security:
        - bearerAuth: []
      parameters:
        - name: unitId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Unit saved to favorites
    delete:
      tags:
        - Properties & Units
      summary: Remove Unit from Favorites
      security:
        - bearerAuth: []
      parameters:
        - name: unitId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Unit removed from favorites

  /properties/{propertyId}/units:
    post:
      tags:
        - Properties & Units
      summary: Add Unit to Property
      security:
        - bearerAuth: []
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnitRequest'
      responses:
        '201':
          description: Unit added

  /properties/units/{unitId}:
    put:
      tags:
        - Properties & Units
      summary: Update Unit Details
      security:
        - bearerAuth: []
      parameters:
        - name: unitId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnitRequest'
      responses:
        '200':
          description: Unit updated

  /properties/{propertyId}/media:
    post:
      tags:
        - Properties & Units
      summary: Upload Property Media File
      description: Uploads a photo or document associated with a property. Accepts multipart/form-data. Max 10MB.
      security:
        - bearerAuth: []
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Media uploaded successfully
          content:
            application/json:
              example:
                success: true
                message: Media file uploaded successfully
                data:
                  id: "med_8812a"
                  propertyId: "prop_123"
                  url: "/uploads/a7b1c-photo.jpg"
                  fileType: "image/jpeg"
                  fileSize: 1048576

  /properties/{id}/approve:
    post:
      tags:
        - Properties & Units
      summary: Admin Moderation Approval
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Property approved for public search

  /discovery/search:
    get:
      tags:
        - Discovery & Recommendations
      summary: Faceted Advanced Search
      parameters:
        - name: query
          in: query
          schema:
            type: string
        - name: amenities
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Faceted search results

  /discovery/recommendations:
    get:
      tags:
        - Discovery & Recommendations
      summary: Get AI Personalized Recommendations
      responses:
        '200':
          description: Recommended properties based on user browsing history

  /discovery/compare:
    post:
      tags:
        - Discovery & Recommendations
      summary: Side-by-Side Property Comparison
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [propertyIds]
              properties:
                propertyIds:
                  type: array
                  items:
                    type: string
                  minItems: 2
                  maxItems: 4
      responses:
        '200':
          description: Matrix of property metrics for comparison

  /discovery/suggestions:
    get:
      tags:
        - Discovery & Recommendations
      summary: Search Auto-Complete Suggestions
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Matching locations and property titles

  /leases/bookings:
    post:
      tags:
        - Leases & Bookings
      summary: Create Property Viewing / Booking Request
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [propertyId, unitId, viewingDate]
              properties:
                propertyId:
                  type: string
                unitId:
                  type: string
                viewingDate:
                  type: string
                  format: date-time
                notes:
                  type: string
      responses:
        '201':
          description: Booking created

  /leases/applications:
    post:
      tags:
        - Leases & Bookings
      summary: Submit Rental Application
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [unitId, moveInDate, monthlyIncome]
              properties:
                unitId:
                  type: string
                moveInDate:
                  type: string
                  format: date
                monthlyIncome:
                  type: number
                employerName:
                  type: string
      responses:
        '201':
          description: Application submitted
    get:
      tags:
        - Leases & Bookings
      summary: List Rental Applications
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Rental applications list

  /leases/applications/{id}:
    get:
      tags:
        - Leases & Bookings
      summary: Get Application Details
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Rental application detail

  /leases/applications/{id}/status:
    patch:
      tags:
        - Leases & Bookings
      summary: Update Rental Application Status
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
