components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer JWT access token passed in Authorization header (`Bearer <token>`).

  schemas:
    SuccessEnvelope:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Request completed successfully
        data:
          type: object
          nullable: true
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    ErrorEnvelope:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Request validation failed
        error:
          type: object
          required: [code, message, timestamp]
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: Invalid email or password provided.
            details:
              type: object
              nullable: true
            timestamp:
              type: string
              format: date-time
              example: "2026-07-24T15:53:00.000Z"
            path:
              type: string
              example: "/api/v1/auth/login"
            correlationId:
              type: string
              example: "req_c381f9a2"

    PaginationMeta:
      type: object
      required: [page, limit, totalItems, totalPages, hasNext, hasPrev]
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        totalItems:
          type: integer
          example: 142
        totalPages:
          type: integer
          example: 8
        hasNext:
          type: boolean
          example: true
        hasPrev:
          type: boolean
          example: false

    RegisterRequest:
      type: object
      required: [email, password, firstName, lastName]
      properties:
        email:
          type: string
          format: email
          example: "newuser@example.com"
        password:
          type: string
          minLength: 8
          example: "P@ssword2026!"
        firstName:
          type: string
          example: "Alex"
        lastName:
          type: string
          example: "Morgan"
        phoneNumber:
          type: string
          example: "+15550192834"
        roleName:
          type: string
          enum: [ROLE_TENANT, ROLE_PROPERTY_OWNER, ROLE_VENDOR]
          default: ROLE_TENANT

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: "tenant@example.com"
        password:
          type: string
          example: "P@ssword2026!"

    UpdateProfileRequest:
      type: object
      properties:
        firstName:
          type: string
          example: "Alexander"
        lastName:
          type: string
          example: "Morgan"
        phoneNumber:
          type: string
          example: "+15550199999"
        bio:
          type: string
        avatarUrl:
          type: string

    PropertyRequest:
      type: object
      required: [title, address, city, state, postalCode, propertyType]
      properties:
        title:
          type: string
          example: "Skyline Luxury Tower"
        description:
          type: string
          example: "Premium high-rise apartment complex with full amenities."
        address:
          type: string
          example: "500 Grand Avenue"
        city:
          type: string
          example: "Austin"
        state:
          type: string
          example: "TX"
        postalCode:
          type: string
          example: "78701"
        propertyType:
          type: string
          enum: [APARTMENT, HOUSE, CONDO, COMMERCIAL]

    UnitRequest:
      type: object
      required: [unitNumber, bedrooms, bathrooms, rentAmount]
      properties:
        unitNumber:
          type: string
          example: "Unit 12B"
        bedrooms:
          type: integer
          example: 2
        bathrooms:
          type: number
          example: 2.0
        squareFeet:
          type: integer
          example: 1150
        rentAmount:
          type: number
          example: 2450.00
        depositAmount:
          type: number
          example: 2450.00
        isAvailable:
          type: boolean
          default: true

  responses:
    BadRequest:
      description: Bad Request / Invalid Parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Bad request syntax or parameters
            error:
              code: BAD_REQUEST
              message: Provided parameter format is invalid.

    Unauthorized:
      description: Authentication Required / Token Expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Authentication required
            error:
              code: UNAUTHORIZED
              message: Access token expired or invalid signature.

    Forbidden:
      description: Insufficient RBAC Permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Forbidden access
            error:
              code: FORBIDDEN
              message: User role 'ROLE_TENANT' lacks required permission 'admin:all'.

    NotFound:
      description: Resource Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Resource not found
            error:
              code: NOT_FOUND
              message: Property record 'prop_999' was not found.

    Conflict:
      description: Resource Duplicate / Constraint Violation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Record already exists
            error:
              code: DUPLICATE_ENTRY
              message: User with specified email already registered.

    ValidationError:
      description: Request Payload Validation Error (Zod)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Request validation failed
            error:
              code: VALIDATION_ERROR
              message: Request validation failed
              details:
                - field: "email"
                  message: "Invalid email format"
                - field: "password"
                  message: "String must contain at least 8 character(s)"

    TooManyRequests:
      description: Rate Limit Exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            error:
              code: TOO_MANY_REQUESTS
              message: Too many authentication attempts. Please try again later.
              timestamp: "2026-07-24T15:53:00Z"
